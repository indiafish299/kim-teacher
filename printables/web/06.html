<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 종이 폭(px)을 뷰포트 폭으로 선언한다. 그러면 폰이 알아서 화면 폭에 맞춰 줄이고,
     손가락으로 벌리면 커진다. JS 로 재서 scale 을 거는 방법도 되지만, 재는 시점과
     글꼴 도착 시점이 어긋나면 조용히 잘린 채로 나온다. 선언이 더 안전하다. -->
<!-- minimum-scale 을 낮춰 둔다. 기본값 0.25 면 레이아웃 폭이 화면의 4배로
     제한돼서, A2(1587px)가 390px 폰에서 1560px 로 잘린다. -->
<meta name="viewport" content="width=1123, minimum-scale=0.1">
<title>자리 배치표 · 1학년 3반</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/print.css">
<style>

/* A4 가로 — 297 x 210 mm.
   'A4 landscape' 대신 mm 실수치를 쓴다. 크롬이 용지를 훨씬 안정적으로 잡는다. */

.sheet { width: 297mm; height: 210mm; }

.head h1 { font-size: 11mm; }
.head .sub { font-size: 5.5mm; }
.head .mascot { height: 26mm; }

.band { height: 11mm; font-size: 5.5mm; margin-top: 2mm; }

/* 창문 | 자리 4x4 | 복도 */
.room {
  flex: 1;
  display: flex;
  gap: 3mm;
  margin-top: 3.5mm;
}
.side { width: 9mm; font-size: 4.6mm; }

/* 짝끼리 붙은 책상 2개 × 4줄. 책상 하나를 한 덩어리로 그리고 그 안을 둘로 나눈다.
   칸 16개를 똑같은 간격으로 늘어놓으면 누가 누구 짝인지 한눈에 안 들어온다. */
.seats {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 5mm 10mm;
}
.desk {
  display: flex;
  background: var(--paper);
  border: 0.6mm solid var(--line);
  border-radius: 2.5mm;
}
.desk .seat + .seat { border-left: 0.4mm dashed var(--line); }

/* 자리 한 칸: 번호는 인쇄, 이름은 보드마카로 쓰는 빈칸 */
.seat {
  position: relative;
  flex: 1;
}
.seat .no {
  position: absolute;
  top: -2.5mm;
  left: 3mm;
  width: 8mm;
  height: 8mm;
  border-radius: 50%;
  background: var(--persimmon);
  color: #fff;
  font-family: var(--font-title);
  font-size: 4.2mm;
  display: flex;
  align-items: center;
  justify-content: center;
}
.foot {
  flex: none;
  display: flex;
  align-items: flex-end;
  gap: 5mm;
  margin-top: 3.5mm;
  height: 22mm;
}
.foot .changed {
  display: flex;
  align-items: center;
  gap: 2.5mm;
  font-size: 4.4mm;
}
.foot .changed .blank { width: 52mm; height: 11mm; min-height: 0; }
.foot .spacer { flex: 1; }
.foot .witty { font-size: 6.4mm; padding-bottom: 1mm; }
.foot .mascot { height: 22mm; }

</style>
<style>
/* ───── 폰 껍데기 ─────
   위 뷰포트 선언 때문에 이 페이지는 항상 1123 폭으로 조판된 뒤 화면 크기로 줄어든다.
   그래서 껍데기 치수도 1123 에 비례해 잡아야 종이와 같은 비율로 줄어든다.
   고정 px 로 잡으면 A2(1587px)에서는 깨알같이, A4(794px)에서는 큼직하게 나온다. */
@media screen {
  html, body { padding: 0; margin: 0; background: #4A3223; display: block;
               width: 1123px; }
}
#top {
  display: flex; align-items: center; gap: 20.4px;
  padding: 23.4px 26.7px; background: #4A3223; color: #FDF6E9;
  font-family: var(--font-body); font-size: 33.0px;
}
#top a { color: #FDF6E9; text-decoration: none; opacity: .75; font-size: 43.2px;
         line-height: 1; }
#top b { font-family: var(--font-title); font-weight: 400; font-size: 43.2px; }
#top i { font-style: normal; opacity: .5; font-size: 33.0px; margin-left: auto; }
/* 종이 폭이 곧 뷰포트 폭이다. 좌우 여백을 주면 딱 그만큼 가로로 넘친다. */
#wrap { padding: 0; }
.sheet { box-shadow: 0 3px 16px rgba(0,0,0,.4); }
#hint { color: #FDF6E9; opacity: .5; font-family: var(--font-body);
        font-size: 33.0px; text-align: center; padding: 26.7px 0 56.1px; }
</style>
</head>
<body>
<div id="top"><a href="index.html">&#8592;</a><b>자리 배치표</b><i>A4 가로</i></div>
<div id="wrap"><div class="sheet">

  <div class="head">
    <img class="mascot" src="assets/svg/quokka-scarf.svg" alt="">
    <div>
      <h1>1학년 3반 자리 배치표</h1>
      <div class="sub">가을에는 창가 자리가 제일 인기</div>
    </div>
    <div class="spacer"></div>
    <img class="mascot" src="assets/svg/leaf-maple.svg" alt="" style="height:18mm">
    <img class="mascot" src="assets/svg/acorn.svg" alt="" style="height:15mm">
  </div>

  <div class="band">칠 판 · 교 탁</div>

  <div class="room">
    <div class="side">창문</div>
    <div class="seats">
      <div class="desk"><div class="seat"><span class="no">1</span></div><div class="seat"><span class="no">2</span></div></div>
      <div class="desk"><div class="seat"><span class="no">3</span></div><div class="seat"><span class="no">4</span></div></div>
      <div class="desk"><div class="seat"><span class="no">5</span></div><div class="seat"><span class="no">6</span></div></div>
      <div class="desk"><div class="seat"><span class="no">7</span></div><div class="seat"><span class="no">8</span></div></div>
      <div class="desk"><div class="seat"><span class="no">9</span></div><div class="seat"><span class="no">10</span></div></div>
      <div class="desk"><div class="seat"><span class="no">11</span></div><div class="seat"><span class="no">12</span></div></div>
      <div class="desk"><div class="seat"><span class="no">13</span></div><div class="seat"><span class="no">14</span></div></div>
      <div class="desk"><div class="seat"><span class="no">15</span></div><div class="seat"><span class="no">16</span></div></div>
    </div>
    <div class="side">복도</div>
  </div>

  <div class="foot">
    <div class="changed">
      <span>자리 바꾼 날</span>
      <div class="blank"></div>
    </div>
    <div class="spacer"></div>
    <div class="witty">짝 바뀌어도 잘 지내기</div>
    <img class="mascot" src="assets/svg/quokka-happy.svg" alt="">
  </div>

</div></div>
<div id="hint">두 손가락으로 벌리면 커집니다</div>
</body>
</html>
