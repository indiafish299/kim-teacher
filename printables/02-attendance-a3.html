<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1학년 3반 출결 특이사항 (A3 세로)</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/print.css">
<style>

/* A3 세로 — 297 x 420 mm. 하루치 한 장.
   가로에서 세로로 돌리며 학생 한 줄이 12.5mm -> 20mm 로 넉넉해졌다.
   보드마카는 볼펜보다 굵어서 줄 높이가 곧 쓰기 편한 정도를 좌우한다. */
@page { size: 297mm 420mm; margin: 0; }
.sheet { width: 297mm; height: 420mm; }

.head { gap: 3mm; }
.head h1 { font-size: 9mm; }
.head .sub { font-size: 4mm; margin-top: 1mm; }
.head .mascot { height: 26mm; }

/* 오늘 날짜. tools/set_dates.py 로 다시 찍는다. */
.today { text-align: right; line-height: 1.05; }
.today b { display: block; font-family: var(--font-title); font-weight: 400;
           font-size: 7.5mm; color: var(--maple); }
.today i { display: block; font-style: normal; font-size: 4mm;
           opacity: .65; margin-top: 0.8mm; }

table { flex: 1; border-collapse: collapse; table-layout: fixed;
        margin-top: 4mm; }
th, td { border: 0.3mm solid var(--line); padding: 0; }
td { background: var(--paper); }

.no { width: 13mm; }
.nm { width: 32mm; }
.st { width: 20mm; }

.hd th { height: 11mm; background: var(--ink); color: var(--cream);
         font-family: var(--font-title); font-size: 4.2mm; }

tr th.no { font-family: var(--font-title); font-size: 4.4mm;
           background: var(--tint-fur); }
tr th.nm { background: var(--paper); font-size: 5mm; font-weight: 400;
           text-align: left; padding-left: 3mm; letter-spacing: -0.02em; }
.hd th.no, .hd th.nm { background: var(--ink); color: var(--cream);
                       text-align: center; padding-left: 0; }

/* 해당하는 곳에 동그라미를 친다. 테두리 색을 항목마다 달리 하면
   어느 칸에 쳤는지 교실 뒤에서도 색으로 먼저 읽힌다. */
.st { text-align: center; vertical-align: middle; }
.mk { display: inline-block; width: 9mm; height: 9mm; border-radius: 50%;
      border: 0.7mm solid; vertical-align: middle; }
.c-maple { border-color: var(--maple); }
.c-persimmon { border-color: var(--persimmon); }
.c-ginkgo { border-color: var(--ginkgo); }
.c-moss { border-color: var(--moss); }
.c-none { border-color: var(--ink); opacity: .45; }
.hd th.st { border-left: 0.3mm solid rgba(253, 246, 233, .25); }

.rs { padding-left: 2mm; }

.foot { flex: none; display: flex; align-items: center; gap: 3mm;
        margin-top: 4mm; height: 26mm; }
.foot .allhere { display: flex; align-items: center; gap: 2.5mm;
                 font-family: var(--font-title); font-size: 5mm; }
.foot .allhere .circle { width: 15mm; height: 15mm; border-radius: 50%;
                         border: 0.8mm dashed var(--line);
                         background: var(--paper); }
.foot img { height: 25mm; }
.foot .spacer { flex: 1; }
.foot .witty { font-size: 5.2mm; }
</style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <img class="mascot" src="assets/svg/quokka-surprised.svg" alt="">
    <div>
      <h1>1학년 3반 출결 특이사항</h1>
      <div class="sub">해당하는 곳에 동그라미 &middot; 사유는 오른쪽 칸에</div>
    </div>
    <div class="spacer"></div>
    <div class="today"><b>2026년 9월 15일</b><i>화요일</i></div></div>

  <table>
    <tr class="hd">
      <th class="no">번호</th><th class="nm">이름</th><th class="st">결석</th><th class="st">지각</th><th class="st">조퇴</th><th class="st">병결</th><th class="st">공결</th><th class="rs">사유 &middot; 특이사항</th>
    </tr>
    <tr><th class="no">1</th><th class="nm">구민준</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">2</th><th class="nm">김동우</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">3</th><th class="nm">김동혁</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">4</th><th class="nm">김민주</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">5</th><th class="nm">김은혁</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">6</th><th class="nm">노주호</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">7</th><th class="nm">문지애</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">8</th><th class="nm">박득범</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">9</th><th class="nm">박연희</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">10</th><th class="nm">박하준</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">11</th><th class="nm">이경아</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">12</th><th class="nm">이병수</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">13</th><th class="nm">이주한</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">14</th><th class="nm">최민준</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">15</th><th class="nm">최원호</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
    <tr><th class="no">16</th><th class="nm">최태민</th><td class="st"><span class="mk c-maple"></span></td><td class="st"><span class="mk c-persimmon"></span></td><td class="st"><span class="mk c-ginkgo"></span></td><td class="st"><span class="mk c-moss"></span></td><td class="st"><span class="mk c-none"></span></td><td class="rs"></td></tr>
  </table>

  <div class="foot">
    <div class="allhere"><span>오늘 전원 출석</span><div class="circle"></div></div>
    <img src="assets/svg/quokka-happy.svg" alt="">
    <span class="spacer"></span>
    <span class="witty">빠진 사람은 쿼카가 제일 먼저 알아채요</span>
  </div>
</div>
</body>
</html>
