<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1학년 3반 출결 특이사항 (A3 가로)</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/print.css">
<style>
/* A3 가로 — 420 x 297 mm */
@page { size: 420mm 297mm; margin: 0; }
.sheet { width: 420mm; height: 297mm; }

.head { gap: 4mm; }
.head h1 { font-size: 11mm; }
.head .sub { font-size: 4.6mm; margin-top: 1mm; }
.head .mascot { height: 26mm; }
.head .leaf { height: 17mm; }

.main { flex: 1; display: flex; gap: 5mm; margin-top: 4mm; }

table { flex: 1; border-collapse: collapse; table-layout: fixed; }
th, td { border: 0.3mm solid var(--line); padding: 0; }
td { background: var(--paper); }            /* 보드마카로 쓰는 칸은 순백 */
.no { width: 9mm; }
.nm { width: 30mm; }

/* 머리 두 줄: 주차 이름 + 날짜 적는 빈칸 */
.wkrow th { height: 8mm; background: var(--ink); color: var(--cream);
            font-family: var(--font-title); font-size: 4.4mm; }
.dates td { height: 8mm; }

tr th.no { font-family: var(--font-title); font-size: 4.2mm;
           background: var(--tint-fur); }
tr th.nm { background: var(--paper); font-size: 4.6mm; font-weight: 400;
           text-align: left; padding-left: 2.5mm; letter-spacing: -0.02em; }

/* 아래 두 줄은 위 규칙보다 뒤에 오면서 더 구체적이어야 한다.
   그러지 않으면 머리줄의 '이름' 칸이 흰 바탕에 크림색 글씨가 되어 통째로 안 보인다. */
.wkrow th.no, .wkrow th.nm { background: var(--ink); color: var(--cream); }
.dates th.no, .dates th.nm { background: var(--cream); }
.dates th.nm { font-size: 3.6mm; opacity: .6; }

/* 주차 경계는 굵게 — 한 주가 어디서 끊기는지 한눈에 들어오도록 */
.wk { border-right: 0.9mm solid var(--ink) !important; }

aside { width: 62mm; display: flex; flex-direction: column; }
aside .label { font-family: var(--font-title); font-size: 5mm; padding: 0 0 1.5mm 1mm; }
aside .note { flex: 1; border-width: 0.6mm; }
aside .cheer { flex: none; margin-top: 3mm; display: flex; align-items: center; gap: 2mm; }
aside .cheer img { height: 26mm; }
aside .cheer span { font-family: var(--font-hand); font-size: 4.8mm; color: var(--maple); }
aside .cheer .circle { width: 15mm; height: 15mm; border-radius: 50%;
                       border: 0.8mm dashed var(--line); background: var(--paper); }

.legend { flex: none; display: flex; align-items: center; gap: 7mm;
          margin-top: 3.5mm; font-size: 4.4mm; }
.legend i { display: inline-block; width: 4.5mm; height: 4.5mm; border-radius: 50%;
            margin-right: 1.5mm; vertical-align: -0.9mm; }
.c-maple { background: var(--maple); }
.c-persimmon { background: var(--persimmon); }
.c-ginkgo { background: var(--ginkgo); }
.c-moss { background: var(--moss); }
.c-none { background: var(--paper); border: 0.5mm solid var(--ink); }
.legend .spacer { flex: 1; }
.legend .witty { font-size: 5.6mm; }
</style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <img class="mascot" src="assets/svg/quokka-surprised.svg" alt="">
    <div>
      <h1>1학년 3반 출결 특이사항</h1>
      <div class="sub">결석 · 지각 · 조퇴는 그날 바로 적어두기</div>
    </div>
    <div class="spacer"></div>
    <img class="leaf" src="assets/svg/leaf-maple.svg" alt="">
  </div>

  <div class="main">
    <table>
      <tr class="wkrow">
        <th class="no"></th><th class="nm">이름</th>
        <th colspan="5">1주</th><th colspan="5">2주</th>
        <th colspan="5">3주</th><th colspan="5">4주</th>
      </tr>
      <tr class="dates">
        <th class="no"></th><th class="nm">날짜 &rarr;</th>
        <td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td>
      </tr>
      <tr><th class="no">1</th><th class="nm">구민준</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">2</th><th class="nm">김동우</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">3</th><th class="nm">김동혁</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">4</th><th class="nm">김민주</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">5</th><th class="nm">김은혁</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">6</th><th class="nm">노주호</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">7</th><th class="nm">문지애</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">8</th><th class="nm">박득범</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">9</th><th class="nm">박연희</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">10</th><th class="nm">박하준</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">11</th><th class="nm">이경아</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">12</th><th class="nm">이병수</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">13</th><th class="nm">이주한</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">14</th><th class="nm">최민준</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">15</th><th class="nm">최원호</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
      <tr><th class="no">16</th><th class="nm">최태민</th><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td><td></td><td></td><td></td><td></td><td class="wk"></td></tr>
    </table>

    <aside>
      <div class="label">확인 필요 · 미제출</div>
      <div class="blank note"></div>
      <div class="cheer">
        <img src="assets/svg/quokka-happy.svg" alt="">
        <span>오늘 다 모였으면<br>여기 동그라미</span>
        <div class="circle"></div>
      </div>
    </aside>
  </div>

  <div class="legend">
    <span><i class="c-maple"></i>결석</span>
    <span><i class="c-persimmon"></i>지각</span>
    <span><i class="c-ginkgo"></i>조퇴</span>
    <span><i class="c-moss"></i>병결</span>
    <span><i class="c-none"></i>공결 · 인정</span>
    <span class="spacer"></span>
    <span class="witty">빠진 사람은 쿼카가 제일 먼저 알아채요</span>
  </div>
</div>
</body>
</html>
