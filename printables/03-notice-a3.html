<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘의 알림장 · 급식 (A3 세로)</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/print.css">
<style>

/* A3 세로 — 297 x 420 mm.
   가로에서는 알림(2/3)과 급식(1/3)이 나란히 있었다. 세로로 돌리면 둘 다 폭이
   좁아져 못 쓰므로 위아래로 쌓는다. */
@page { size: 297mm 420mm; margin: 0; }
.sheet { width: 297mm; height: 420mm; }

.head { gap: 3mm; }
.head h1 { font-size: 10mm; }
.head .sub { font-size: 4.2mm; margin-top: 1mm; }
.head .mascot { height: 26mm; }

/* 날짜 줄 — 매일 보드마카로 갈아 쓴다 */
.datebar { flex: none; display: flex; align-items: center; gap: 2.5mm;
           margin-top: 4mm; }
.datebar .slot { display: flex; align-items: center; gap: 1.5mm;
                 font-family: var(--font-title); font-size: 6mm; }
.datebar .slot .blank { width: 23mm; height: 15mm; min-height: 0; }
.datebar .spacer { flex: 1; }
.weather { display: flex; gap: 2mm; }
.weather .w { width: 17mm; height: 17mm; border-radius: 50%;
              border: 0.6mm solid var(--line); background: var(--paper);
              display: flex; align-items: center; justify-content: center;
              font-size: 3.8mm; }

.block { display: flex; flex-direction: column; margin-top: 5mm; }
.block .label { flex: none; font-family: var(--font-title); font-size: 6.5mm;
                padding: 0 0 2mm 1mm; }
.notice { flex: 3; }
.notice .lines { flex: 1; display: flex; flex-direction: column; gap: 2.5mm; }
.notice .line { flex: 1; background: var(--paper);
                border: 0.5mm solid var(--line); border-radius: 1.5mm; }
.lunch { flex: 2; }
.lunch .body { flex: 1; display: flex; gap: 3mm; }
.lunch .blank { flex: 1; border-width: 0.6mm; }
.lunch .mascot { flex: none; align-self: flex-end; height: 34mm; }

.tomorrow { flex: none; display: flex; align-items: center; gap: 3mm;
            margin-top: 5mm; height: 22mm; }
.tomorrow .label { font-family: var(--font-title); font-size: 5.5mm;
                   white-space: nowrap; }
.tomorrow .blank { flex: 1; height: 100%; }
</style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <img class="mascot" src="assets/svg/quokka-scarf.svg" alt="">
    <div>
      <h1>오늘의 알림장</h1>
      <div class="sub">1학년 3반 &middot; 매일 아침 새로 씁니다</div>
    </div>
    <div class="spacer"></div>
    <img class="mascot" src="assets/svg/persimmon.svg" alt="" style="height:18mm">
  </div>

  <div class="datebar">
    <div class="slot"><div class="blank"></div>월</div>
    <div class="slot"><div class="blank"></div>일</div>
    <div class="slot"><div class="blank"></div>요일</div>
    <div class="spacer"></div>
    <div class="weather"><div class="w">맑음</div><div class="w">흐림</div><div class="w">비</div><div class="w">바람</div><div class="w">눈</div></div>
  </div>

  <div class="block notice">
    <div class="label">오늘의 알림</div>
    <div class="lines"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div>
  </div>

  <div class="block lunch">
    <div class="label">오늘 급식</div>
    <div class="body">
      <div class="blank"></div>
      <img class="mascot" src="assets/svg/quokka-happy.svg" alt="">
    </div>
  </div>

  <div class="tomorrow">
    <div class="label">내일 준비물</div>
    <div class="blank"></div>
  </div>
</div>
</body>
</html>
