<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>1학년 3반 생일 축하 달력 (A3 세로)</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/print.css">
<style>
/* A3 세로 — 297 x 420 mm */
@page { size: 297mm 420mm; margin: 0; }
.sheet { width: 297mm; height: 420mm; }

.head { gap: 4mm; }
.head h1 { font-size: 13mm; }
.head .sub { font-size: 5mm; margin-top: 1mm; }
.head .mascot { height: 34mm; }

.months { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(4, 1fr); gap: 4mm; margin-top: 5mm; }
.card { background: var(--paper); border: 0.6mm solid var(--line);
        border-radius: 3mm; padding: 3mm; display: flex; flex-direction: column; }
.card .m { flex: none; display: flex; align-items: center; justify-content: space-between;
           font-family: var(--font-title); font-size: 8mm; color: var(--maple);
           padding-bottom: 2mm; }
.card .ic { height: 12mm; }
.card .ic.big { height: 18mm; margin: -3mm -1mm -1mm 0; }
.card .names { flex: 1; display: flex; flex-direction: column;
               justify-content: space-between; gap: 1.5mm; }
.card .ln { flex: 1; border-bottom: 0.4mm dashed var(--line); }

.foot { flex: none; display: flex; align-items: center; gap: 3mm; margin-top: 4mm; }
.foot .witty { font-size: 6.5mm; }
.foot .spacer { flex: 1; }
.foot img { height: 24mm; }
</style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <img class="mascot" src="assets/svg/quokka-happy.svg" alt="">
    <div>
      <h1>1학년 3반 생일</h1>
      <div class="sub">이름은 보드마카로 — 전학 와도 바로 추가</div>
    </div>
    <div class="spacer"></div>
    <img class="mascot" src="assets/svg/leaf-maple.svg" alt="" style="height:20mm">
  </div>

  <div class="months">
    <div class="card"><div class="m">1월<img class="ic big" src="assets/svg/quokka-earmuffs.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">2월<img class="ic" src="assets/svg/chestnut.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">3월<img class="ic" src="assets/svg/leaf-ginkgo.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">4월<img class="ic" src="assets/svg/acorn.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">5월<img class="ic" src="assets/svg/persimmon.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">6월<img class="ic" src="assets/svg/leaf-maple.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">7월<img class="ic" src="assets/svg/acorn.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">8월<img class="ic" src="assets/svg/chestnut.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">9월<img class="ic" src="assets/svg/persimmon.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">10월<img class="ic" src="assets/svg/leaf-maple.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">11월<img class="ic" src="assets/svg/acorn.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
    <div class="card"><div class="m">12월<img class="ic big" src="assets/svg/quokka-scarf.svg" alt=""></div><div class="names"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>
  </div>

  <div class="foot">
    <span class="witty">생일인 사람은 그날 하루 쿼카 대접</span>
    <span class="spacer"></span>
    <img src="assets/svg/quokka-earmuffs.svg" alt="">
  </div>
</div>
</body>
</html>
